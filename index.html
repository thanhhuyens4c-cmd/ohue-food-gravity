<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ẩm Thực Miền Trung - Cửa Hàng O Huệ</title>
    <!-- Thư viện vật lý Matter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #fcf8f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* 1. LỚP TOPPING NỀN */
        #topping-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .topping-item {
            position: absolute;
            font-size: 2rem;
            opacity: 0.6;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08));
            animation: floatAround linear infinite;
        }
        @keyframes floatAround {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(100px, 40px) rotate(180deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* 2. THANH HEADER */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #b8332a;
            color: #ffffff;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            z-index: 100;
        }
        .top-bar {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .top-bar h1 {
            font-size: 1.05rem;
            font-weight: 700;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .music-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            padding: 5px 10px;
            border-radius: 16px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }
        .music-btn.playing {
            background: #f5c542;
            color: #4a120e;
            border-color: #f5c542;
        }
        .wheel-nav-btn {
            background: linear-gradient(135deg, #ff9f43, #ee5253);
            border: 1px solid #ffeaa7;
            color: #ffffff;
            padding: 5px 12px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .contact-btn {
            background: #f5c542;
            color: #4a120e;
            padding: 5px 12px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 0.8rem;
            text-decoration: none;
        }

        .category-menu {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 8px 12px;
            gap: 8px;
            scrollbar-width: none;
        }
        .category-menu::-webkit-scrollbar {
            display: none;
        }
        .cat-btn {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .cat-btn.active {
            background: #f5c542;
            color: #4a120e;
            border-color: #f5c542;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .instruction {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            pointer-events: none;
            z-index: 100;
            text-align: center;
        }

        /* 3. THẺ MÓN ĂN */
        .food-card {
            position: absolute;
            width: 190px;
            height: 105px;
            background: #ffffff;
            border: 2px solid #b8332a;
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            pointer-events: none;
            z-index: 20;
            will-change: transform;
        }
        .food-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #b8332a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .food-location {
            font-size: 0.68rem;
            color: #888;
            font-weight: 500;
        }
        .food-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed #eee;
            padding-top: 4px;
        }
        .food-price {
            font-size: 0.8rem;
            font-weight: bold;
            color: #27ae60;
        }
        .hint-badge {
            background: #fdf2e9;
            color: #d35400;
            font-size: 0.65rem;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* 4. MODAL VÒNG QUAY "HÔM NAY ĂN GÌ?" */
        .wheel-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 15px;
        }
        .wheel-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .wheel-modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .wheel-modal-overlay.active .wheel-modal-card {
            transform: scale(1);
        }
        .wheel-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #b8332a;
            margin-bottom: 4px;
        }
        .wheel-subtitle {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 15px;
        }
        .wheel-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 15px;
        }
        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.2, 1);
        }
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #e74c3c;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
            z-index: 10;
        }
        .spin-action-btn {
            background: linear-gradient(135deg, #b8332a, #e74c3c);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(184, 51, 42, 0.4);
            transition: transform 0.1s;
        }
        .spin-action-btn:active {
            transform: scale(0.96);
        }
        .spin-action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }
        .close-wheel-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #888;
            cursor: pointer;
            padding: 5px 10px;
        }

        /* 5. POPUP CHI TIẾT MÓN ĂN (TỐI ƯU SIÊU MƯỢT) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-out;
            padding: 20px;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transform: scale(0.92);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            pointer-events: auto;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        .modal-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .modal-body {
            padding: 16px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .modal-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: #b8332a;
        }
        .modal-price {
            font-size: 1.1rem;
            font-weight: bold;
            color: #27ae60;
        }
        .modal-desc {
            font-size: 0.85rem;
            color: #555;
            line-height: 1.4;
            margin-bottom: 16px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .close-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            background: #f1f2f6;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            pointer-events: auto;
            text-align: center;
            transition: background 0.15s;
        }
        .close-btn:active {
            background: #dfe4ea;
        }
        .order-btn {
            flex: 2;
            padding: 12px;
            background: #b8332a;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- THẺ AUDIO -->
    <audio id="bgMusic" loop preload="auto">
        <source src="./nhac-mien-trung.mp3.mp3" type="audio/mpeg">
    </audio>

    <div id="topping-layer"></div>

    <header>
        <div class="top-bar">
            <h1>ẨM THỰC O HUỆ - MIỀN TRUNG</h1>
            <div class="header-controls">
                <button class="wheel-nav-btn" onclick="openWheelModal()">🎁 Hôm Nay Ăn Gì?</button>

    <script>
        // ==========================================
        // 1. TỔNG HỢP ÂM THANH (WEB AUDIO API)
        // ==========================================
        let audioCtx = null;
        let lastSoundTime = 0;

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playCollisionSound(intensity = 1) {
            if (!audioCtx) return;
            const now = Date.now();
            if (now - lastSoundTime < 40) return;
            lastSoundTime = now;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const volume = Math.min(Math.max(intensity * 0.12, 0.03), 0.25);
                const startFreq = 160 + Math.random() * 40;

                osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.09);
            } catch (e) {}
        }

        function playTickSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        function playWinSound() {
            if (!audioCtx) return;
            try {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.1 + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + index * 0.1);
                    osc.stop(audioCtx.currentTime + index * 0.1 + 0.4);
                });
            } catch (e) {}
        }

        // ==========================================
        // 2. NHẠC NỀN
        // ==========================================
        const bgMusic = document.getElementById('bgMusic');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const musicIcon = document.getElementById('musicIcon');
        const musicText = document.getElementById('musicText');
        let isMusicPlaying = false;

        function updateMusicUI(playing) {
            if (playing) {
                musicToggleBtn.classList.add('playing');
                musicIcon.innerText = '🔊';
                musicText.innerText = 'Tắt Nhạc';
            } else {
                musicToggleBtn.classList.remove('playing');
                musicIcon.innerText = '🔈';
                musicText.innerText = 'Bật Nhạc';
            }
        }

        function toggleMusic() {
            initAudioContext();
            if (isMusicPlaying) {
                bgMusic.pause();
                isMusicPlaying = false;
                updateMusicUI(false);
            } else {
                bgMusic.volume = 0.45;
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    updateMusicUI(true);
                }).catch(err => console.log("Lỗi nhạc:", err));
            }
        }

        const autoPlayOnFirstTouch = () => {
            initAudioContext();
            if (!isMusicPlaying) {
                bgMusic.volume = 0.4;
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    updateMusicUI(true);
                }).catch(() => {});
            }
            window.removeEventListener('pointerdown', autoPlayOnFirstTouch);
        };
        window.addEventListener('pointerdown', autoPlayOnFirstTouch, { once: true });

        // ==========================================
        // 3. DỮ LIỆU ĐẦY ĐỦ 44 MÓN ĂN

        const menuData = {

                { title: "Cao Lầu Hội An", loc: "Hội An", price: "45.000đ", desc: "Sợi cao lầu tro củi đặc trưng, thịt xá xíu thơm lừng, da heo chiên giòn rụm.", img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=600&q=80" },
                { title: "Cơm Gà Hội An", loc: "Hội An", price: "55.000đ", desc: "Cơm nấu nước luộc gà vàng ươm, thịt gà ta xé phay bóp gỏi hành tây chua ngọt.", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80" },
                { title: "Bánh Tráng Cuốn Thịt Heo", loc: "Đà Nẵng", price: "65.000đ", desc: "Thịt heo hai đầu da luộc mềm cuốn bánh tráng đại lộc chấm mắm nêm nguyên chất.", img: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80" },

                { title: "Nem Nướng", loc: "Đà Nẵng", price: "45.000đ", desc: "Nem thịt nướng lụi than hồng thơm lừng chấm tương đậu phộng sền sệt.", img: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80" },

                { title: "Chè Đậu Xanh Đánh", loc: "Hội An", price: "20.000đ", desc: "Đậu xanh đãi vỏ nấu nhuyễn sánh mịn, thơm ngát cốt dừa tươi và đường phèn.", img: "https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?auto=format&fit=crop&w=600&q=80" }
            ],

        };

        const allFoods = [];
        Object.keys(menuData).forEach(key => {
            menuData[key].forEach(food => allFoods.push(food));
        });

        // TOPPING NỀN
        const toppingLayer = document.getElementById('topping-layer');
        const toppingIcons = ['🦐', '🥩', '🌶️', '🥟', '🍋', '🌿', '🧄', '🥢', '🍘'];
        for (let i = 0; i < 14; i++) {
            const item = document.createElement('div');
            item.className = 'topping-item';
            item.innerText = toppingIcons[i % toppingIcons.length];
            item.style.left = Math.random() * 90 + 'vw';
            item.style.top = Math.random() * 85 + 'vh';
            item.style.animationDuration = (Math.random() * 8 + 8) + 's';
            item.style.animationDelay = '-' + (Math.random() * 5) + 's';
            toppingLayer.appendChild(item);
        }

        // ==========================================
        // 4. THIẾT LẬP VẬT LÝ & FIX LỖI CHỒNG CLICK
        // ==========================================
        const { Engine, Runner, Bodies, Composite, Mouse, MouseConstraint, Events, Query } = Matter;
        const engine = Engine.create();
        const world = engine.world;
        engine.world.gravity.y = 0.8;

        const width = window.innerWidth;
        const height = window.innerHeight;

        const wallOptions = { isStatic: true, render: { visible: false } };
        const ground = Bodies.rectangle(width / 2, height + 30, width * 2, 60, wallOptions);
        const leftWall = Bodies.rectangle(-30, height / 2, 60, height * 2, wallOptions);
        const rightWall = Bodies.rectangle(width + 30, height / 2, 60, height * 2, wallOptions);
        const ceiling = Bodies.rectangle(width / 2, 85, width * 2, 10, wallOptions);

        Composite.add(world, [ground, leftWall, rightWall, ceiling]);

        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach((pair) => {
                const { bodyA, bodyB } = pair;
                const speedA = bodyA.speed || 0;
                const speedB = bodyB.speed || 0;
                const relativeSpeed = Math.max(speedA, speedB);

                if (relativeSpeed > 1.2) {
                    playCollisionSound(relativeSpeed);
                }
            });
        });

        let cardBodies = [];
        let cardIdCounter = 0;
        const cardsContainer = document.getElementById('cards-container');

        function loadRegionFoods(regionKey) {
            initAudioContext();
            cardsContainer.innerHTML = '';
            cardBodies.forEach(({ body }) => Composite.remove(world, body));
            cardBodies = [];

            const foods = menuData[regionKey] || [];

            foods.forEach((item, index) => {
                cardIdCounter++;
                const card = document.createElement('div');
                card.className = 'food-card';
                card.style.zIndex = 20 + index;
                card.setAttribute('data-title', item.title);
                card.setAttribute('data-price', item.price);
                card.setAttribute('data-desc', item.desc);
                card.setAttribute('data-img', item.img);

                card.innerHTML = `
                    <div>
                        <div class="food-title">${item.title}</div>
                        <div class="food-location">📍 ${item.loc}</div>
                    </div>
                    <div class="food-footer">
                        <span class="food-price">${item.price}</span>
                        <span class="hint-badge">Xem 🔍</span>
                    </div>
                `;
                cardsContainer.appendChild(card);

                const startX = 80 + (index % 5) * ((width - 200) / 4);
                const startY = 105 + Math.floor(index / 5) * 50;

                const body = Bodies.rectangle(startX, startY, 190, 105, {
                    restitution: 0.45,
                    friction: 0.3,
                    density: 0.002
                });

                body.customData = card;
                body.renderOrder = index; // Ghi nhớ thứ tự tạo

                cardBodies.push({ element: card, body: body });
                Composite.add(world, body);
            });
        }

        function switchRegion(regionKey, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            loadRegionFoods(regionKey);
        }

        const mouse = Mouse.create(document.body);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: { stiffness: 0.2, render: { visible: false } }
        });
        Composite.add(world, mouseConstraint);

        let startPoint = { x: 0, y: 0 };
        let startTime = 0;
        let isModalOpen = false;

        Events.on(mouseConstraint, 'startdrag', (evt) => {
            initAudioContext();
            startPoint = { x: mouse.position.x, y: mouse.position.y };
            startTime = Date.now();
        });

        // XỬ LÝ CHỌN CHÍNH XÁC THẺ TRÊN CÙNG KHI CHẠM
        Events.on(mouseConstraint, 'enddrag', (evt) => {
            if (isModalOpen) return;

            const distanceMoved = Math.hypot(
                mouse.position.x - startPoint.x,
                mouse.position.y - startPoint.y
            );
            const duration = Date.now() - startTime;

            // Nếu chỉ là thao tác chạm nhẹ (< 15px và < 350ms)
            if (distanceMoved < 15 && duration < 350) {
                // Quét tất cả vật thể nằm ngay vị trí con trỏ chuột
                const allUnderCursor = Query.point(cardBodies.map(cb => cb.body), mouse.position);
                
                if (allUnderCursor.length > 0) {
                    // Lọc lấy vật thể ở lớp trên cùng (renderOrder lớn nhất)
                    allUnderCursor.sort((a, b) => b.renderOrder - a.renderOrder);
                    const topmostBody = allUnderCursor[0];
                    
                    if (topmostBody && topmostBody.customData) {
                        openModal(topmostBody.customData);
                    }
                }
            }
        });

        const runner = Runner.create();
        Runner.run(runner, engine);

        Events.on(engine, 'afterUpdate', () => {
            cardBodies.forEach(({ element, body }) => {
                const { x, y } = body.position;
                const angle = body.angle;
                element.style.transform = `translate(${x - 95}px, ${y - 52.5}px) rotate(${angle}rad)`;
            });
        });

        // ==========================================
        // 5. XỬ LÝ VÒNG QUAY RANDOM
        // ==========================================
        const wheelModalOverlay = document.getElementById('wheelModalOverlay');
        const wheelCanvas = document.getElementById('wheelCanvas');
        const ctx = wheelCanvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const closeWheelBtn = document.getElementById('closeWheelBtn');
        let currentWheelAngle = 0;
        let isSpinning = false;

        const wheelColors = ['#f39c12', '#e74c3c', '#27ae60', '#2980b9', '#8e44ad', '#d35400', '#16a085'];

        function drawWheel() {
            const numSegments = allFoods.length;
            const arcSize = (2 * Math.PI) / numSegments;
            const radius = 300;
            ctx.clearRect(0, 0, 600, 600);

            for (let i = 0; i < numSegments; i++) {
                const angle = i * arcSize;
                ctx.beginPath();
                ctx.fillStyle = wheelColors[i % wheelColors.length];
                ctx.moveTo(300, 300);
                ctx.arc(300, 300, radius, angle, angle + arcSize);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(300, 300);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Arial';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 3;
                const text = allFoods[i].title.length > 14 ? allFoods[i].title.substring(0, 13) + '..' : allFoods[i].title;
                ctx.fillText(text, radius - 20, 4);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(300, 300, 35, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#b8332a';
            ctx.stroke();

            ctx.fillStyle = '#b8332a';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('O HUỆ', 300, 305);
        }

        drawWheel();

        function openWheelModal() {
            initAudioContext();
            isModalOpen = true;
            wheelModalOverlay.classList.add('active');
        }

        function closeWheelModal() {
            if (isSpinning) return;
            wheelModalOverlay.classList.remove('active');
            isModalOpen = false;
        }

        closeWheelBtn.addEventListener('pointerup', (e) => {
            e.stopPropagation();
            closeWheelModal();
        });

        wheelModalOverlay.addEventListener('pointerup', (e) => {
            if (e.target === wheelModalOverlay) {
                closeWheelModal();
            }
        });

        function spinWheel() {
            if (isSpinning) return;
            initAudioContext();
            isSpinning = true;
            spinBtn.disabled = true;

            const numSegments = allFoods.length;
            const arcDegree = 360 / numSegments;

            const winningIndex = Math.floor(Math.random() * numSegments);
            const winningFood = allFoods[winningIndex];

            const extraRounds = 360 * (5 + Math.floor(Math.random() * 3));
            const stopAngle = 270 - (winningIndex * arcDegree + arcDegree / 2);
            const totalRotation = currentWheelAngle + extraRounds + (stopAngle - (currentWheelAngle % 360));

            currentWheelAngle = totalRotation;
            wheelCanvas.style.transform = `rotate(${currentWheelAngle}deg)`;

            let tickInterval = 60;
            let tickTimer = null;
            const runTicks = () => {
                playTickSound();
                tickInterval *= 1.05;
                if (tickInterval < 450) {
                    tickTimer = setTimeout(runTicks, tickInterval);
                }
            };
            runTicks();

            setTimeout(() => {
                clearTimeout(tickTimer);
                isSpinning = false;
                spinBtn.disabled = false;
                playWinSound();

                setTimeout(() => {
                    closeWheelModal();
                    openDirectModal(winningFood);
                }, 600);
            }, 4100);
        }

        // ==========================================
        // 6. XỬ LÝ POPUP CHI TIẾT (ĐÃ FIX TOÀN DIỆN NÚT ĐÓNG)
        // ==========================================
        const modalOverlay = document.getElementById('modalOverlay');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        const modalPrice = document.getElementById('modalPrice');
        const modalDesc = document.getElementById('modalDesc');
        const closeBtn = document.getElementById('closeBtn');

        function openModal(cardElement) {
            initAudioContext();
            isModalOpen = true;
            modalImg.src = cardElement.getAttribute('data-img');
            modalTitle.innerText = cardElement.getAttribute('data-title');
            modalPrice.innerText = cardElement.getAttribute('data-price');
            modalDesc.innerText = cardElement.getAttribute('data-desc');
            modalOverlay.classList.add('active');
        }

        function openDirectModal(foodObj) {
            initAudioContext();
            isModalOpen = true;
            modalImg.src = foodObj.img;
            modalTitle.innerText = "🎉 Gợi Ý: " + foodObj.title;
            modalPrice.innerText = foodObj.price;
            modalDesc.innerText = `[${foodObj.loc}] - ${foodObj.desc}`;
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            isModalOpen = false;
        }

        // Bắt sự kiện trực tiếp bằng pointerup để loại bỏ hoàn toàn độ trễ click
        closeBtn.addEventListener('pointerup', (e) => {
            e.stopPropagation();
            e.preventDefault();
            closeModal();
        });

        modalOverlay.addEventListener('pointerup', (e) => {
            if (e.target === modalOverlay) {
                e.stopPropagation();
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeWheelModal();
            }
        });

        loadRegionFoods('danang_quangnam');
    </script>
</body>
</html>
