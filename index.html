<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z1275YFSCM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-Z1275YFSCM');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ẩm Thực O Huệ - Tinh Hoa Ẩm Thực Miền Trung</title>
    
    <!-- Phông chữ chuẩn hóa tiếng Việt Be Vietnam Pro & Merriweather -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    
    <!-- Thư viện vật lý Matter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    
    <style>
        :root {
            --hoian-yellow: #E5A93C;      /* Vàng ấm tường cổ Hội An */
            --bg-solid: #F5EFEB;          /* NỀN TRƠN: Màu kem giấy dó ấm trang nhã */
            --burgundy: #8E2824;          /* Đỏ đô trầm cung đình */
            --burgundy-dark: #5C1512;     /* Đỏ đô thẫm gỗ gụ */
            --teal-blue: #1C4E5B;         /* Xanh cổ vịt (Teal Blue) */
            --teal-dark: #10323B;         /* Xanh cổ vịt trầm sâu */
            --charcoal: #2A2421;          /* Đen mun than củi */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-solid); /* NỀN TRƠN NHÃ NHẶN */
            font-family: 'Be Vietnam Pro', sans-serif;
            color: var(--charcoal);
        }

        /* 1. LỚP TOPPING NỀN LƠ LỬNG NHẸ */
        #topping-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .topping-item {
            position: absolute;
            font-size: 1.4rem;
            opacity: 0.35;
            animation: floatAround linear infinite;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
            will-change: transform;
        }
        @keyframes floatAround {
            0% { transform: translate3d(0, 0, 0) rotate(0deg); }
            50% { transform: translate3d(35px, 15px, 0) rotate(180deg); }
            100% { transform: translate3d(0, 0, 0) rotate(360deg); }
        }

        /* 2. THANH HEADER */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, var(--teal-dark) 0%, var(--teal-blue) 100%);
            border-bottom: 2px solid var(--hoian-yellow);
            box-shadow: 0 4px 16px rgba(16, 50, 59, 0.25);
            z-index: 1000;
            pointer-events: auto !important;
        }
        .top-bar {
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(229, 169, 60, 0.25);
        }
        .brand-block {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-logo-icon {
            font-size: 1.35rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .brand-name {
            font-family: 'Merriweather', serif;
            font-size: 1.12rem;
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: 0.5px;
        }
        .brand-sub {
            font-size: 0.65rem;
            color: var(--hoian-yellow);
            display: block;
            margin-top: -1px;
            font-weight: 500;
            letter-spacing: 0.4px;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .wheel-nav-btn {
            background: linear-gradient(135deg, var(--burgundy), #A8322D);
            border: 1px solid var(--hoian-yellow);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(142, 40, 36, 0.3);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .music-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(229, 169, 60, 0.4);
            color: #FFFFFF;
            padding: 6px 10px;
            border-radius: 18px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }
        .music-btn.playing {
            background: var(--hoian-yellow);
            color: var(--teal-dark);
            border-color: #fff;
            font-weight: 700;
        }

        /* Menu tỉnh thành */
        .category-menu {
            display: flex;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            white-space: nowrap;
            padding: 7px 12px;
            gap: 8px;
            scrollbar-width: none;
            pointer-events: auto !important;
            touch-action: pan-x !important;
            background: rgba(16, 50, 59, 0.35);
        }
        .category-menu::-webkit-scrollbar {
            display: none;
        }
        .cat-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(229, 169, 60, 0.35);
            color: #FFFFFF;
            padding: 5px 14px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .cat-btn.active {
            background: var(--hoian-yellow);
            color: var(--teal-dark);
            border-color: #FFFFFF;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .instruction {
            position: fixed;
            bottom: 12px;
            right: 16px;
            background: rgba(18, 53, 62, 0.9);
            border: 1px solid var(--hoian-yellow);
            color: #FFFFFF;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            pointer-events: none;
            z-index: 100;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* 3. KHUNG VẬT LÝ */
        #physics-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            touch-action: none;
        }

        /* 4. THẺ MÓN ĂN */
        .food-card {
            position: absolute;
            background: #FFFDF9;
            border: 1.5px solid var(--hoian-yellow);
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 6px 14px rgba(42, 36, 33, 0.12), inset 0 0 0 1px rgba(229, 169, 60, 0.2);
            pointer-events: none;
            z-index: 20;
            will-change: transform, opacity;
            width: 155px;
            height: 90px;
            transition: opacity 0.2s ease, transform 0.1s linear;
        }
        @media (min-width: 768px) {
            .food-card {
                width: 195px;
                height: 110px;
                padding: 10px 12px;
                border-width: 2px;
            }
        }
        .food-card.dragging-to-cart {
            border-color: var(--burgundy);
            box-shadow: 0 8px 20px rgba(142, 40, 36, 0.35);
        }
        .food-card-header {
            display: flex;
            flex-direction: column;
        }
        .food-title {
            font-family: 'Merriweather', serif;
            font-size: 0.86rem;
            font-weight: 700;
            color: var(--burgundy);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media (min-width: 768px) {
            .food-title { font-size: 0.96rem; }
        }
        .food-location {
            font-size: 0.65rem;
            color: var(--teal-blue);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .food-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed #E2D7C5;
            padding-top: 4px;
        }
        .food-price {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--teal-blue);
        }
        .hint-badge {
            background: #FAF3E0;
            color: var(--burgundy);
            border: 1px solid rgba(229, 169, 60, 0.6);
            font-size: 0.62rem;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: 700;
        }

        /* 5. GIỎ NAN TRE GÓC DƯỚI BÊN TRÁI */
        #bamboo-cart-zone {
            position: fixed;
            bottom: 12px;
            left: 12px;
            width: 85px;
            height: 85px;
            background: radial-gradient(circle at 35% 35%, #F4D393 0%, #D89838 70%, #9C671B 100%);
            border: 3px solid #6C4410;
            border-radius: 50%;
            box-shadow: 0 8px 24px rgba(42, 36, 33, 0.35), inset 0 0 10px rgba(108, 68, 16, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 900;
            cursor: pointer;
            pointer-events: auto !important;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.2s;
        }
        @media (min-width: 768px) {
            #bamboo-cart-zone {
                width: 100px;
                height: 100px;
                bottom: 16px;
                left: 16px;
            }
        }
        #bamboo-cart-zone.drag-hover {
            transform: scale(1.18) rotate(-5deg);
            border-color: var(--burgundy);
            box-shadow: 0 12px 30px rgba(142, 40, 36, 0.5);
        }
        #bamboo-cart-zone.item-dropped {
            animation: cartBounce 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes cartBounce {
            0% { transform: scale(1); }
            40% { transform: scale(1.3) rotate(8deg); }
            75% { transform: scale(0.9) rotate(-4deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .basket-icon {
            font-size: 2.2rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .basket-text {
            font-size: 0.6rem;
            font-weight: 800;
            color: #432607;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: -2px;
        }
        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--burgundy);
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        /* 6. MODAL XEM CHI TIẾT GIỎ HÀNG */
        .cart-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(16, 50, 59, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        .cart-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .cart-modal-card {
            background: #FFFDF9;
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            border: 2px solid var(--hoian-yellow);
            padding: 18px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.4);
            position: relative;
            transform: scale(0.95);
            transition: transform 0.25s ease;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        .cart-modal-overlay.active .cart-modal-card {
            transform: scale(1);
        }
        .cart-title {
            font-family: 'Merriweather', serif;
            font-size: 1.18rem;
            font-weight: 900;
            color: var(--burgundy);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #E2D7C5;
            padding-bottom: 10px;
        }
        .cart-items-list {
            overflow-y: auto;
            max-height: 45vh;
            margin: 10px 0;
            padding-right: 4px;
        }
        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #EDE2D2;
        }
        .cart-item-info h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--charcoal);
        }
        .cart-item-info span {
            font-size: 0.72rem;
            color: var(--teal-blue);
            font-weight: 600;
        }
        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .qty-btn {
            background: #EDE2D2;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .cart-total-bar {
            border-top: 2px solid var(--hoian-yellow);
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .cart-total-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--charcoal);
        }
        .cart-total-val {
            font-family: 'Merriweather', serif;
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--burgundy);
        }
        .checkout-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(180deg, var(--burgundy) 0%, var(--burgundy-dark) 100%);
            border: 1.5px solid var(--hoian-yellow);
            color: #FFFFFF;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.92rem;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }
        .close-cart-btn {
            position: absolute;
            top: 12px;
            right: 14px;
            background: none;
            border: none;
            font-size: 1.6rem;
            color: var(--teal-blue);
            cursor: pointer;
        }

        /* 7. MODAL VÒNG QUAY */
        .wheel-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(16, 50, 59, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 12px;
            backdrop-filter: blur(4px);
        }
        .wheel-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .wheel-modal-card {
            background: #FFFDF9;
            width: 100%;
            max-width: 350px;
            border-radius: 20px;
            border: 2.5px solid var(--hoian-yellow);
            padding: 20px 16px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .wheel-modal-overlay.active .wheel-modal-card {
            transform: scale(1);
        }
        .wheel-title {
            font-family: 'Merriweather', serif;
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--burgundy);
            margin-bottom: 2px;
        }
        .wheel-subtitle {
            font-size: 0.78rem;
            color: var(--teal-blue);
            margin-bottom: 12px;
            font-weight: 500;
        }
        .wheel-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto 15px;
        }
        @media (min-width: 768px) {
            .wheel-wrapper { width: 290px; height: 290px; }
        }
        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(28, 78, 91, 0.25);
            border: 3px solid var(--hoian-yellow);
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.2, 1);
            will-change: transform;
        }
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid var(--burgundy);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            z-index: 10;
        }
        .spin-action-btn {
            background: linear-gradient(180deg, var(--burgundy) 0%, var(--burgundy-dark) 100%);
            color: #FFFFFF;
            border: 1.5px solid var(--hoian-yellow);
            padding: 11px 28px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(142, 40, 36, 0.35);
        }
        .spin-action-btn:disabled {
            background: #A09890;
            border-color: #CCC;
            box-shadow: none;
        }
        .close-wheel-btn {
            position: absolute;
            top: 8px;
            right: 12px;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: var(--teal-blue);
            cursor: pointer;
            line-height: 1;
            z-index: 20;
        }

        /* 8. POPUP CHI TIẾT */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(16, 50, 59, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #FFFDF9;
            width: 100%;
            max-width: 350px;
            border-radius: 20px;
            border: 2px solid var(--hoian-yellow);
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(0,0,0,0.4);
            transform: scale(0.95);
            transition: transform 0.25s ease;
            position: relative;
            pointer-events: auto;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        .modal-close-x {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(28, 78, 91, 0.85);
            border: 1.5px solid var(--hoian-yellow);
            color: #FFFFFF;
            border-radius: 50%;
            font-size: 1.4rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            pointer-events: auto !important;
        }
        .modal-close-x:active {
            background: var(--burgundy);
            transform: scale(0.92);
        }
        .modal-img {
            width: 100%;
            height: 195px;
            object-fit: cover;
            display: block;
            border-bottom: 2px solid var(--hoian-yellow);
        }
        .modal-body {
            padding: 16px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }
        .modal-title {
            font-family: 'Merriweather', serif;
            font-size: 1.12rem;
            font-weight: 700;
            color: var(--burgundy);
        }
        .modal-price {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--teal-blue);
        }
        .modal-desc {
            font-size: 0.82rem;
            color: #4A403A;
            line-height: 1.45;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .add-cart-direct-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(180deg, var(--burgundy) 0%, var(--burgundy-dark) 100%);
            border: 1.5px solid var(--hoian-yellow);
            color: #FFFFFF;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.92rem;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(142, 40, 36, 0.3);
        }
    </style>
</head>
<body>

    <!-- NHẠC NỀN -->
    <audio id="bgMusic" loop preload="auto">
        <source src="./nhac-mien-trung.mp3.mp3" type="audio/mpeg">
    </audio>

    <div id="topping-layer"></div>

    <!-- HEADER -->
    <header>
        <div class="top-bar">
            <div class="brand-block">
                <span class="brand-logo-icon">🏮</span>
                <div>
                    <h1 class="brand-name">Ẩm Thực O Huệ</h1>
                    <span class="brand-sub">Hương Vị Cố Đô & Miền Trung</span>
                </div>
            </div>
            <div class="header-controls">
                <button class="wheel-nav-btn" onclick="openWheelModal()">🎁 Hôm Nay Ăn Gì?</button>
                <button class="music-btn" id="musicToggleBtn" onclick="toggleMusic()">
                    <span id="musicIcon">🔈</span> <span id="musicText">Nhạc</span>
                </button>
            </div>
        </div>
        <div class="category-menu">
            <button class="cat-btn active" onclick="switchRegion('danang_quangnam', this)">Đà Nẵng – Quảng Nam</button>

        // ==========================================
        // 1. TỔNG HỢP ÂM THANH (WEB AUDIO API)
        // ==========================================
        let audioCtx = null;
        let lastSoundTime = 0;

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Âm thanh gõ va chạm
        function playCollisionSound(intensity = 1) {
            if (!audioCtx) return;
            const now = Date.now();
            if (now - lastSoundTime < 60) return;
            lastSoundTime = now;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const volume = Math.min(Math.max(intensity * 0.08, 0.02), 0.18);
                const startFreq = 175 + Math.random() * 30;

                osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.07);

                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        // Âm thanh thả món vào giỏ nan tre "Poof/Chime"
        function playAddToCartSound() {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                // Nốt 1: Tiếng nứa gõ
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(440, now);
                osc1.frequency.exponentialRampToValueAtTime(880, now + 0.12);
                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.22);

                // Nốt 2: Tiếng chuông vàng
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(1320, now + 0.08);
                gain2.gain.setValueAtTime(0.15, now + 0.08);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.08);
                osc2.stop(now + 0.38);
            } catch (e) {}
        }

        function playTickSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.03);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        function playWinSound() {
            if (!audioCtx) return;
            try {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.08);
                    gain.gain.setValueAtTime(0.18, audioCtx.currentTime + index * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + index * 0.08);
                    osc.stop(audioCtx.currentTime + index * 0.08 + 0.35);
                });
            } catch (e) {}
        }

        // ==========================================
        // 2. NHẠC NỀN
        // ==========================================
        const bgMusic = document.getElementById('bgMusic');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const musicIcon = document.getElementById('musicIcon');
        const musicText = document.getElementById('musicText');
        let isMusicPlaying = false;

        function updateMusicUI(playing) {
            if (playing) {
                musicToggleBtn.classList.add('playing');
                musicIcon.innerText = '🔊';
                musicText.innerText = 'Tắt';
            } else {
                musicToggleBtn.classList.remove('playing');
                musicIcon.innerText = '🔈';
                musicText.innerText = 'Nhạc';
            }
        }

        function toggleMusic() {
            initAudioContext();
            if (isMusicPlaying) {
                bgMusic.pause();
                isMusicPlaying = false;
                updateMusicUI(false);
            } else {
                bgMusic.volume = 0.45;
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    updateMusicUI(true);
                }).catch(() => {});
            }
        }

        const autoPlayOnFirstTouch = () => {
            initAudioContext();
            if (!isMusicPlaying) {
                bgMusic.volume = 0.4;
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    updateMusicUI(true);
                }).catch(() => {});
            }
            window.removeEventListener('pointerdown', autoPlayOnFirstTouch);
        };

                { id: "btb_9", rawPrice: 35000, title: "Bánh Bột Lọc", loc: "Quảng Bình", price: "35.000đ", desc: "Bánh lọc trần chấm mắm ruốc ớt cay nồng đậm chất miền cát trắng.", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80" },
                { id: "btb_10", rawPrice: 35000, title: "Bánh Khoái", loc: "Đồng Hới", price: "35.000đ", desc: "Vỏ bánh dày giòn rụm nhân tôm thịt chấm nước lèo gan heo sánh béo.", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80" },
                { id: "btb_11", rawPrice: 30000, title: "Bún Hến Mai Xá", loc: "Gio Linh - Quảng Trị", price: "30.000đ", desc: "Bún chắt chắt ngọt lịm béo ngậy kèm rau thơm và gừng tươi cay nồng.", img: "https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?auto=format&fit=crop&w=600&q=80" },
                { id: "btb_12", rawPrice: 35000, title: "Bánh Ướt Phương Lang", loc: "Hải Lăng - Quảng Trị", price: "35.000đ", desc: "Bánh ướt gạo dẻo cuốn thịt heo nướng chấm nước lèo tương ớt Quảng Trị cay xé.", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80" }
            ]
        };

        const allFoods = [];
        Object.keys(menuData).forEach(key => {
            menuData[key].forEach(food => allFoods.push(food));
        });

        // QUẢN LÝ DỮ LIỆU GIỎ HÀNG
        let myCart = {};

        function addToCart(foodItem) {
            initAudioContext();
            if (myCart[foodItem.id]) {
                myCart[foodItem.id].qty += 1;
            } else {
                myCart[foodItem.id] = { ...foodItem, qty: 1 };
            }
            playAddToCartSound();
            animateCartZone();
            updateCartBadge();
        }

        function updateCartQty(foodId, delta) {
            if (myCart[foodId]) {
                myCart[foodId].qty += delta;
                if (myCart[foodId].qty <= 0) {
                    delete myCart[foodId];
                }
                updateCartBadge();
                renderCartModal();
            }
        }

        function animateCartZone() {
            const cart = document.getElementById('bamboo-cart-zone');
            cart.classList.remove('item-dropped');
            void cart.offsetWidth; // Trigger reflow
            cart.classList.add('item-dropped');
        }

        function updateCartBadge() {
            let totalQty = 0;
            Object.values(myCart).forEach(item => totalQty += item.qty);
            document.getElementById('cartBadgeCount').innerText = totalQty;
            document.getElementById('cartTotalItems').innerText = totalQty;
        }

        function renderCartModal() {
            const container = document.getElementById('cartItemsContainer');
            container.innerHTML = '';
            let total = 0;

            const items = Object.values(myCart);
            if (items.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:20px; color:#888; font-size:0.85rem;">Giỏ nan tre đang trống.<br>Hãy kéo món thả vào giỏ nhé!</p>';
            } else {
                items.forEach(item => {
                    total += item.rawPrice * item.qty;
                    const row = document.createElement('div');
                    row.className = 'cart-item-row';
                    row.innerHTML = `
                        <div class="cart-item-info">
                            <h4>${item.title}</h4>
                            <span>${item.price}</span>
                        </div>
                        <div class="cart-item-qty">
                            <button class="qty-btn" onclick="updateCartQty('${item.id}', -1)">-</button>
                            <span style="font-size:0.85rem; font-weight:700;">${item.qty}</span>
                            <button class="qty-btn" onclick="updateCartQty('${item.id}', 1)">+</button>
                        </div>
                    `;
                    container.appendChild(row);
                });
            }
            document.getElementById('cartTotalPrice').innerText = total.toLocaleString('vi-VN') + 'đ';
        }

        function openCartModal() {
            initAudioContext();
            isModalOpen = true;
            renderCartModal();
            document.getElementById('cartModalOverlay').classList.add('active');
        }

        function closeCartModal() {
            document.getElementById('cartModalOverlay').classList.remove('active');
            isModalOpen = false;
        }

        // TOPPING
        const isMobile = window.innerWidth < 768;
        const toppingLayer = document.getElementById('topping-layer');
        const toppingIcons = ['🏮', '🪷', '🌶️', '🦐', '🥟', '🥢', '🌿'];
        const totalToppings = isMobile ? 7 : 12;

        for (let i = 0; i < totalToppings; i++) {
            const item = document.createElement('div');
            item.className = 'topping-item';
            item.innerText = toppingIcons[i % toppingIcons.length];
            item.style.left = Math.random() * 88 + 'vw';
            item.style.top = Math.random() * 80 + 'vh';
            item.style.animationDuration = (Math.random() * 8 + 10) + 's';
            item.style.animationDelay = '-' + (Math.random() * 5) + 's';
            toppingLayer.appendChild(item);
        }

        // ==========================================
        // 4. THIẾT LẬP VẬT LÝ & KÉO THẢ VÀO GIỎ
        // ==========================================
        const { Engine, Runner, Bodies, Composite, Mouse, MouseConstraint, Events, Query } = Matter;
        const engine = Engine.create();
        const world = engine.world;
        engine.world.gravity.y = isMobile ? 0.75 : 0.8;

        const width = window.innerWidth;
        const height = window.innerHeight;

        const wallOptions = { isStatic: true, render: { visible: false } };
        const ground = Bodies.rectangle(width / 2, height + 25, width * 2, 50, wallOptions);
        const leftWall = Bodies.rectangle(-25, height / 2, 50, height * 2, wallOptions);
        const rightWall = Bodies.rectangle(width + 25, height / 2, 50, height * 2, wallOptions);
        const ceiling = Bodies.rectangle(width / 2, 75, width * 2, 10, wallOptions);

        Composite.add(world, [ground, leftWall, rightWall, ceiling]);

        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach((pair) => {
                const { bodyA, bodyB } = pair;
                const speedA = bodyA.speed || 0;
                const speedB = bodyB.speed || 0;
                const relativeSpeed = Math.max(speedA, speedB);

                if (relativeSpeed > 1.5) {
                    playCollisionSound(relativeSpeed);
                }
            });
        });

        let cardBodies = [];
        const cardsContainer = document.getElementById('cards-container');
        const cardW = isMobile ? 155 : 195;
        const cardH = isMobile ? 90 : 110;

        function loadRegionFoods(regionKey) {
            initAudioContext();
            cardsContainer.innerHTML = '';
            cardBodies.forEach(({ body }) => Composite.remove(world, body));
            cardBodies = [];

            const foods = menuData[regionKey] || [];
            const cols = isMobile ? 2 : 4;

            foods.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'food-card';
                card.style.zIndex = 20 + index;
                card.setAttribute('data-title', item.title);
                card.setAttribute('data-price', item.price);
                card.setAttribute('data-desc', item.desc);
                card.setAttribute('data-img', item.img);

                card.innerHTML = `
                    <div class="food-card-header">
                        <div class="food-title">${item.title}</div>
                        <div class="food-location">📍 ${item.loc}</div>
                    </div>
                    <div class="food-footer">
                        <span class="food-price">${item.price}</span>
                        <span class="hint-badge">Xem Chi Tiết 🔍</span>
                    </div>
                `;
                cardsContainer.appendChild(card);

                const colIdx = index % cols;
                const rowIdx = Math.floor(index / cols);
                const startX = (width / (cols + 1)) * (colIdx + 1);
                const startY = 90 + rowIdx * 45;

                const body = Bodies.rectangle(startX, startY, cardW, cardH, {
                    restitution: 0.4,
                    friction: 0.35,
                    density: 0.002
                });

                body.customData = card;
                body.foodRawData = item;
                body.renderOrder = index;

                cardBodies.push({ element: card, body: body });
                Composite.add(world, body);
            });
        }

        function switchRegion(regionKey, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            loadRegionFoods(regionKey);
        }

        const physicsContainer = document.getElementById('physics-container');
        const mouse = Mouse.create(physicsContainer);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: { stiffness: 0.25, render: { visible: false } }
        });
        Composite.add(world, mouseConstraint);

        let startPoint = { x: 0, y: 0 };
        let startTime = 0;
        let isModalOpen = false;
        let draggedBody = null;

        const cartElement = document.getElementById('bamboo-cart-zone');

        Events.on(mouseConstraint, 'startdrag', (evt) => {
            initAudioContext();
            startPoint = { x: mouse.position.x, y: mouse.position.y };
            startTime = Date.now();
            draggedBody = evt.body;
            if (draggedBody && draggedBody.customData) {
                draggedBody.customData.classList.add('dragging-to-cart');
            }
        });

        // Kiểm tra xem vị trí chuột/thẻ có rơi trúng giỏ nan tre không
        Events.on(engine, 'afterUpdate', () => {
            if (draggedBody) {
                const cartRect = cartElement.getBoundingClientRect();
                const mouseX = mouse.position.x;
                const mouseY = mouse.position.y;
                
                // Mở rộng vùng hứng giỏ tre để bắt dính mượt mà
                const isHoveringCart = (
                    mouseX >= cartRect.left - 25 &&
                    mouseX <= cartRect.right + 25 &&
                    mouseY >= cartRect.top - 25 &&
                    mouseY <= cartRect.bottom + 25
                );

                if (isHoveringCart) {
                    cartElement.classList.add('drag-hover');
                } else {
                    cartElement.classList.remove('drag-hover');
                }
            }
        });

        Events.on(mouseConstraint, 'enddrag', () => {
            if (isModalOpen) return;

            const cartRect = cartElement.getBoundingClientRect();
            const mouseX = mouse.position.x;
            const mouseY = mouse.position.y;

            const isDroppedIntoCart = (
                mouseX >= cartRect.left - 25 &&
                mouseX <= cartRect.right + 25 &&
                mouseY >= cartRect.top - 25 &&
                mouseY <= cartRect.bottom + 25
            );

            // NẾU THẢ VÀO GIỎ NAN TRE
            if (draggedBody && isDroppedIntoCart && draggedBody.foodRawData) {
                addToCart(draggedBody.foodRawData);
                
                // Hiệu ứng hút thẻ vào giỏ tre
                const el = draggedBody.customData;
                if (el) {
                    el.style.transition = 'all 0.25s ease-in';
                    el.style.transform = `translate3d(${cartRect.left}px, ${cartRect.top}px, 0) scale(0.1)`;
                    el.style.opacity = '0';
                    setTimeout(() => {
                        el.style.transition = '';
                        el.style.opacity = '1';
                        // Đưa vật thể về lại vị trí ngẫu nhiên trên cao
                        Matter.Body.setPosition(draggedBody, {
                            x: Math.random() * (width - 200) + 100,
                            y: 100
                        });
                        Matter.Body.setVelocity(draggedBody, { x: 0, y: 0 });
                    }, 300);
                }
            } else {
                // NẾU CHỈ LÀ THAO TÁC CHẠM (CLICK) ĐỂ XEM CHI TIẾT
                const distanceMoved = Math.hypot(
                    mouse.position.x - startPoint.x,
                    mouse.position.y - startPoint.y
                );
                const duration = Date.now() - startTime;

                if (distanceMoved < 15 && duration < 350) {
                    const allUnderCursor = Query.point(cardBodies.map(cb => cb.body), mouse.position);
                    if (allUnderCursor.length > 0) {
                        allUnderCursor.sort((a, b) => b.renderOrder - a.renderOrder);
                        const topmostBody = allUnderCursor[0];
                        if (topmostBody && topmostBody.customData) {
                            openModal(topmostBody.customData, topmostBody.foodRawData);
                        }
                    }
                }
            }

            if (draggedBody && draggedBody.customData) {
                draggedBody.customData.classList.remove('dragging-to-cart');
            }
            cartElement.classList.remove('drag-hover');
            draggedBody = null;
        });

        const runner = Runner.create();
        Runner.run(runner, engine);

        const halfW = cardW / 2;
        const halfH = cardH / 2;

        Events.on(engine, 'afterUpdate', () => {
            cardBodies.forEach(({ element, body }) => {
                if (!element.style.transition) {
                    const { x, y } = body.position;
                    const angle = body.angle;
                    element.style.transform = `translate3d(${x - halfW}px, ${y - halfH}px, 0) rotate(${angle}rad)`;
                }
            });
        });

        // ==========================================
        // 5. VÒNG QUAY "HÔM NAY ĂN GÌ?"
        // ==========================================
        const wheelModalOverlay = document.getElementById('wheelModalOverlay');
        const wheelCanvas = document.getElementById('wheelCanvas');
        const ctx = wheelCanvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        let currentWheelAngle = 0;
        let isSpinning = false;

        const wheelColors = ['#8E2824', '#E5A93C', '#1C4E5B', '#A8322D', '#2A6877', '#D49326', '#5C1512'];

        function drawWheel() {
            const numSegments = allFoods.length;
            const arcSize = (2 * Math.PI) / numSegments;
            const radius = 300;
            ctx.clearRect(0, 0, 600, 600);

            for (let i = 0; i < numSegments; i++) {
                const angle = i * arcSize;
                ctx.beginPath();
                ctx.fillStyle = wheelColors[i % wheelColors.length];
                ctx.moveTo(300, 300);
                ctx.arc(300, 300, radius, angle, angle + arcSize);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(300, 300);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#FFFDF9';
                ctx.font = 'bold 12px "Be Vietnam Pro", sans-serif';
                const text = allFoods[i].title.length > 13 ? allFoods[i].title.substring(0, 12) + '..' : allFoods[i].title;
                ctx.fillText(text, radius - 20, 4);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(300, 300, 38, 0, 2 * Math.PI);
            ctx.fillStyle = '#FFFDF9';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#E5A93C';
            ctx.stroke();

            ctx.fillStyle = '#8E2824';
            ctx.font = 'bold 15px "Merriweather", serif';
            ctx.textAlign = 'center';
            ctx.fillText('O HUỆ', 300, 305);
        }

        drawWheel();

        function openWheelModal() {
            initAudioContext();
            isModalOpen = true;
            wheelModalOverlay.classList.add('active');
        }

        function closeWheelModal() {
            if (isSpinning) return;
            wheelModalOverlay.classList.remove('active');
            isModalOpen = false;
        }

        function spinWheel() {
            if (isSpinning) return;
            initAudioContext();
            isSpinning = true;
            spinBtn.disabled = true;

            const numSegments = allFoods.length;
            const arcDegree = 360 / numSegments;

            const winningIndex = Math.floor(Math.random() * numSegments);
            const winningFood = allFoods[winningIndex];

            const extraRounds = 360 * (5 + Math.floor(Math.random() * 3));
            const stopAngle = 270 - (winningIndex * arcDegree + arcDegree / 2);
            const totalRotation = currentWheelAngle + extraRounds + (stopAngle - (currentWheelAngle % 360));

            currentWheelAngle = totalRotation;
            wheelCanvas.style.transform = `rotate(${currentWheelAngle}deg)`;

            let tickInterval = 60;
            let tickTimer = null;
            const runTicks = () => {
                playTickSound();
                tickInterval *= 1.05;
                if (tickInterval < 450) {
                    tickTimer = setTimeout(runTicks, tickInterval);
                }
            };
            runTicks();

            setTimeout(() => {
                clearTimeout(tickTimer);
                isSpinning = false;
                spinBtn.disabled = false;
                playWinSound();

                setTimeout(() => {
                    closeWheelModal();
                    openDirectModal(winningFood);
                }, 600);
            }, 4100);
        }

        // ==========================================
        // 6. POPUP CHI TIẾT & NÚT THÊM GIỎ HÀNG
        // ==========================================
        const modalOverlay = document.getElementById('modalOverlay');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        const modalPrice = document.getElementById('modalPrice');
        const modalDesc = document.getElementById('modalDesc');
        const addDirectBtn = document.getElementById('addDirectBtn');
        let currentModalFood = null;

        function openModal(cardElement, foodRawData) {
            initAudioContext();
            isModalOpen = true;
            currentModalFood = foodRawData;
            modalImg.src = cardElement.getAttribute('data-img');
            modalTitle.innerText = cardElement.getAttribute('data-title');
            modalPrice.innerText = cardElement.getAttribute('data-price');
            modalDesc.innerText = cardElement.getAttribute('data-desc');
            modalOverlay.classList.add('active');
        }

        function openDirectModal(foodObj) {
            initAudioContext();
            isModalOpen = true;
            currentModalFood = foodObj;
            modalImg.src = foodObj.img;
            modalTitle.innerText = "🏮 Gợi Ý: " + foodObj.title;
            modalPrice.innerText = foodObj.price;
            modalDesc.innerText = `[${foodObj.loc}] - ${foodObj.desc}`;
            modalOverlay.classList.add('active');
        }

        addDirectBtn.addEventListener('click', () => {
            if (currentModalFood) {
                addToCart(currentModalFood);
                closeModal();
            }
        });

        function closeModal() {
            modalOverlay.classList.remove('active');
            isModalOpen = false;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeWheelModal();
                closeCartModal();
            }
        });

        loadRegionFoods('danang_quangnam');
    </script>
</body>
</html>
